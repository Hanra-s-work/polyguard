# pyproject.toml

[build-system]
requires = ["setuptools >= 80.9.0", "wheel >= 0.36.2", "pep517 >= 0.11.0"]
build-backend = "setuptools.build_meta"


[tool.setuptools.packages.find]
# Include the top-level package and any of its subpackages (polyguard.src, etc.)
include = ["polyguard", "polyguard.*"]
exclude = ["lenv", "menv", "wenv", "env", "venv", ".env", ".venv"]

[project]
name = "polyguard"
version = '1.0.0'
license = "MIT"
authors = [
    { name = "Henry Letellier", email = "henrysoftwarehouse@protonmail.com" },
]
maintainers = [
    { name = "Henry Letellier", email = "henrysoftwarehouse@protonmail.com" },
]
dependencies = []
description = "A module that provides a set of swearwords to listen to when filtering while allowing to toggle on and off different languages."
license-files = ["LICENSE"]
readme = { file = "README.md", content-type = "text/markdown" }
keywords = [
    "profanity",
    "profanity-filter",
    "swear-words",
    "word-filter",
    "text-filtering",
    "text-sanitization",
    "content-moderation",
    "chat-moderation",
    "multilingual",
    "python",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    # Specify the Python versions you support here.
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Text Processing :: Filters",
]
requires-python = ">=3.9"

[project.urls]
Homepage = "https://github.com/Hanra-s-work/polyguard"
Documentation = "https://github.com/Hanra-s-work/polyguard/blob/main/README.md"
Repository = "https://github.com/Hanra-s-work/polyguard.git"
Issues = "https://github.com/Hanra-s-work/polyguard/issues"

[project.scripts]
# Console script to generate the SQLite DB from plaintext lists.
polyguard-generate-db = "polyguard.src.generate_db:main"
polyguard = "polyguard.src.cli:main"
